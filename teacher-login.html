<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login - Attendance Management System</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .login-wrapper::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      top: -200px;
      right: -200px;
      animation: float 6s ease-in-out infinite;
    }

    .login-wrapper::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255,255,255,0.03);
      border-radius: 50%;
      bottom: -150px;
      left: -150px;
      animation: float 8s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    .login-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      animation: bounceIn 0.6s ease-out;
    }

    .login-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .login-header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
      animation: pulse 3s ease-in-out infinite;
    }

    .login-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      position: relative;
    }

    .login-header p {
      opacity: 0.9;
      font-size: 0.9rem;
      position: relative;
    }

    .login-body {
      padding: 2rem;
    }

    .auth-tabs {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .auth-tab {
      flex: 1;
      padding: 0.7rem;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      color: var(--text-light);
      position: relative;
      z-index: 1;
    }

    .auth-tab.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .form-group {
      margin-bottom: 1.1rem;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text);
      transition: color 0.2s;
    }

    .form-group:focus-within label {
      color: var(--primary);
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      transition: all 0.2s;
      background: white;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
      transform: translateY(-1px);
    }

    .form-control:hover {
      border-color: #cbd5e1;
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      transition: all 0.2s;
      border-radius: 4px;
    }

    .password-toggle:hover {
      color: var(--primary);
      background: var(--bg);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .btn-loading .btn-text {
      display: none;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .btn-loading .spinner {
      display: inline-block;
    }

    .demo-accounts {
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--bg);
      border-radius: 10px;
      font-size: 0.85rem;
      border: 1px dashed var(--border);
    }

    .demo-accounts h4 {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .demo-accounts p {
      margin: 0.3rem 0;
      color: var(--text-light);
      font-size: 0.85rem;
    }

    .demo-accounts strong {
      color: var(--text);
      font-weight: 600;
    }

    .alert {
      padding: 0.85rem 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert.show { display: flex; }
    .alert-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }

    .form-section {
      display: none;
      animation: slideUp 0.3s ease-out;
    }

    .form-section.active {
      display: block;
    }

    .password-hint {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 0.25rem;
      font-weight: 500;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-control.with-icon {
      padding-left: 2.5rem;
    }

    .form-group:focus-within .input-icon {
      color: var(--primary);
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0;
      font-size: 0.85rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .remember-me input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    .toast {
      position: fixed;
      top: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 1100;
      transform: translateX(120%);
      transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      border-left: 4px solid var(--success);
      font-weight: 500;
    }

    .toast.show {
      transform: translateX(0);
    }

    .toast.error {
      border-left-color: var(--danger);
    }

    .toast.warning {
      border-left-color: var(--warning);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1>👨‍🏫 Teacher Portal</h1>
        <p>Sign in to manage attendance</p>
      </div>
      <div class="login-body">
        <div id="alert" class="alert"></div>

        <div class="auth-tabs">
          <button class="auth-tab active" onclick="switchAuthTab('signin')">Sign In</button>
          <button class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</button>
        </div>

        <!-- Sign In Form -->
        <form id="signinForm" class="form-section active" onsubmit="handleSignIn(event)">
          <div class="form-group">
            <label>Username</label>
            <div style="position: relative;">
              <span class="input-icon">👤</span>
              <input type="text" class="form-control with-icon" id="signinUsername" required placeholder="Enter username" style="padding-left: 2.5rem;">
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">
              <input type="password" class="form-control" id="signinPassword" required placeholder="Enter password" style="padding-right: 2.5rem;">
              <button type="button" class="password-toggle" onclick="togglePassword('signinPassword', this)">
                👁️
              </button>
            </div>
          </div>
          <input type="hidden" id="signinRole" value="teacher">

          <div class="remember-forgot">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link" onclick="showAlert('Password reset coming soon!', 'warning'); return false;">Forgot password?</a>
          </div>

          <button type="submit" class="btn" id="signinBtn">
            <span class="btn-text">Sign In</span>
            <span class="spinner"></span>
          </button>
        </form>

        <!-- Sign Up Form -->
        <form id="signupForm" class="form-section" onsubmit="handleSignUp(event)">
          <div class="form-group">
            <label>Full Name</label>
            <div style="position: relative;">
              <span class="input-icon">👤</span>
              <input type="text" class="form-control with-icon" id="signupName" required placeholder="Enter full name" style="padding-left: 2.5rem;">
            </div>
          </div>
          <div class="form-group">
            <label>Username</label>
            <div style="position: relative;">
              <span class="input-icon">@</span>
              <input type="text" class="form-control with-icon" id="signupUsername" required placeholder="Choose a username" style="padding-left: 2.5rem;">
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">
              <input type="password" class="form-control" id="signupPassword" required placeholder="Create password" minlength="6" style="padding-right: 2.5rem;">
              <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', this)">
                👁️
              </button>
            </div>
            <p class="password-hint">Minimum 6 characters</p>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <div class="password-wrapper">
              <input type="password" class="form-control" id="signupConfirmPassword" required placeholder="Confirm password" style="padding-right: 2.5rem;">
              <button type="button" class="password-toggle" onclick="togglePassword('signupConfirmPassword', this)">
                👁️
              </button>
            </div>
          </div>
          <input type="hidden" id="signupRole" value="teacher">
          <button type="submit" class="btn" id="signupBtn">
            <span class="btn-text">Create Account</span>
            <span class="spinner"></span>
          </button>
        </form>

        <div class="demo-accounts">
          <h4>🧪 Demo Teacher Account</h4>
          <p><strong>Username:</strong> teacher</p>
          <p><strong>Password:</strong> teacher123</p>
        </div>

        <div style="text-align: center; margin-top: 1rem;">
          <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.9rem;">
            ← Back to main login
          </a>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
  <script>
    let currentRole = 'teacher';

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type === 'danger' ? 'error' : type === 'warning' ? 'warning' : ''}`;
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));

      if (tab === 'signin') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('signinForm').classList.add('active');
      } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('signupForm').classList.add('active');
      }
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function setButtonLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      if (loading) {
        btn.classList.add('btn-loading');
      } else {
        btn.classList.remove('btn-loading');
      }
    }

    function handleSignIn(e) {
      e.preventDefault();
      const username = document.getElementById('signinUsername').value.trim();
      const password = document.getElementById('signinPassword').value;
      const role = 'teacher';

      setButtonLoading('signinBtn', true);

      setTimeout(() => {
        const users = Storage.getUsers();
        const user = users.find(u => u.username === username && u.password === password && u.role === role);

        if (!user) {
          showToast('Invalid credentials. Please try again.', 'danger');
          setButtonLoading('signinBtn', false);
          return;
        }

        const session = {
          userId: user.id,
          username: user.username,
          role: user.role,
          name: user.name
        };

        Storage.setSession(session);
        showToast('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          window.location.href = 'teacher-dashboard.html';
        }, 500);
      }, 800);
    }

    function handleSignUp(e) {
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('signupConfirmPassword').value;
      const role = 'teacher';

      if (password !== confirmPassword) {
        showToast('Passwords do not match!', 'danger');
        return;
      }

      if (password.length < 6) {
        showToast('Password must be at least 6 characters!', 'danger');
        return;
      }

      setButtonLoading('signupBtn', true);

      setTimeout(() => {
        const users = Storage.getUsers();

        if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
          showToast('Username already exists. Please choose another.', 'danger');
          setButtonLoading('signupBtn', false);
          return;
        }

        const newUser = {
          id: generateId(),
          username,
          password,
          role,
          name
        };

        users.push(newUser);
        Storage.setUsers(users);

        showToast('Account created successfully! Please sign in.', 'success');
        switchAuthTab('signin');
        document.getElementById('signinUsername').value = username;
        document.getElementById('signinPassword').value = '';
        document.getElementById('signupForm').reset();
        setButtonLoading('signupBtn', false);
      }, 800);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const inputs = document.querySelectorAll('.form-control');
      inputs.forEach(input => {
        input.addEventListener('input', () => {
          if (input.value.trim() !== '') {
            input.parentElement.querySelector('.input-icon')?.style.setProperty('color', 'var(--primary)');
          } else {
            input.parentElement.querySelector('.input-icon')?.style.setProperty('color', 'var(--text-light)');
          }
        });
      });
    });
  </script>
</body>
</html>
